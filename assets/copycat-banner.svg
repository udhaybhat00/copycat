<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
<title id="title">Copycat — stay with the conversation</title><desc id="desc">Original illustration of Copycat's compact question and answer overlay. Ten minute trial, twenty dollars per month. Created by Udhay Bhat.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b0d14"/><stop offset="1" stop-color="#1b1930"/></linearGradient><radialGradient id="glow"><stop stop-color="#9782f0" stop-opacity=".32"/><stop offset="1" stop-color="#9782f0" stop-opacity="0"/></radialGradient><linearGradient id="accent"><stop stop-color="#c4b1ff"/><stop offset="1" stop-color="#8ba4ff"/></linearGradient><linearGradient id="glass" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".13"/><stop offset="1" stop-color="#ffffff" stop-opacity=".035"/></linearGradient><pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse"><path d="M52 0H0V52" fill="none" stroke="#d7ceff" stroke-opacity=".035"/></pattern><filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000000" flood-opacity=".4"/></filter></defs>
<rect width="1280" height="640" rx="30" fill="url(#bg)"/><rect width="1280" height="640" rx="30" fill="url(#grid)"/><ellipse cx="1020" cy="280" rx="510" ry="480" fill="url(#glow)"/>
<g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<g transform="translate(62 57)"><rect width="37" height="37" rx="12" fill="url(#accent)"/><path d="M9 15 12 8l7 5 7-5 3 9v9c-6 7-17 6-20 0Z" fill="#241d42"/><path d="M13 22h3m7 0h3m-9 5 3 1 3-1" fill="none" stroke="#d9cbff" stroke-width="2" stroke-linecap="round"/><text x="49" y="26" fill="#efeef6" font-size="25" font-weight="700" letter-spacing="-.7">Copycat</text></g>
<text x="62" y="178" fill="#a9a0c4" font-size="13" font-weight="600" letter-spacing="2.3">YOUR DESKTOP CONVERSATION COPILOT</text>
<text x="58" y="253" fill="#f5f3fc" font-size="57" font-weight="650" letter-spacing="-2.5">Stay with the</text><text x="58" y="318" fill="url(#accent)" font-size="57" font-weight="650" letter-spacing="-2.5">conversation.</text>
<text x="62" y="367" fill="#afb2c4" font-size="18">Live transcription. Contextual answers.</text><text x="62" y="397" fill="#afb2c4" font-size="18">A calmer space to think, learn, and prepare.</text>
<rect x="62" y="440" width="189" height="49" rx="14" fill="url(#accent)"/><text x="86" y="471" fill="#211b36" font-size="15" font-weight="700">Try it for 10 minutes</text><text x="62" y="522" fill="#8e91a7" font-size="13">macOS · Windows · Bring your own AI provider</text>
<g transform="translate(629 139) rotate(-2 270 180)" filter="url(#shadow)">
<rect width="578" height="63" rx="17" fill="#4b4a57" stroke="#8d859e" stroke-opacity=".55"/><g fill="#c2b5f0"><circle cx="27" cy="28" r="5"/><path d="M19 40h16M27 34v7" stroke="#c2b5f0" stroke-width="2"/></g>
<rect x="52" y="13" width="102" height="38" rx="10" fill="#2d2d39"/><text x="68" y="37" fill="#f0edf8" font-size="14">Answer ↵</text><rect x="163" y="13" width="136" height="38" rx="10" fill="#2d2d39"/><text x="180" y="37" fill="#f0edf8" font-size="14">Screenshot</text><rect x="308" y="13" width="86" height="38" rx="10" fill="#2d2d39"/><text x="330" y="37" fill="#f0edf8" font-size="14">Chat</text><text x="425" y="39" fill="#d9d3e5" font-size="24">⋮</text><rect x="464" y="13" width="95" height="38" rx="10" fill="#e44d6b"/><text x="498" y="37" fill="white" font-size="14">End</text>
<rect y="73" width="578" height="54" rx="15" fill="#393a47" stroke="#5c5b6f"/><g stroke="#a5e794" stroke-width="4" stroke-linecap="round"><path d="M23 95v12m8-19v25m8-16v10"/></g><text x="60" y="106" fill="#d7d6e1" font-size="14">What makes an API resilient?</text>
<rect y="139" width="578" height="255" rx="18" fill="#222431" stroke="#777287"/><text x="24" y="176" fill="#c1b2e8" font-size="12" font-weight="600">QUESTION</text><text x="24" y="207" fill="#f1eef8" font-size="20" font-weight="600">What makes an API resilient?</text><path d="M24 226H554" stroke="#45424f"/>
<text x="24" y="256" fill="#c1b2e8" font-size="12" font-weight="600">ANSWER</text><text x="24" y="289" fill="#eeeaf6" font-size="18">Design for failure, then make recovery routine.</text><text x="24" y="324" fill="#aaa9bd" font-size="15">Bounded retries · Timeouts · Idempotent requests</text><text x="24" y="368" fill="#73758d" font-size="11">Illustrative product preview</text>
</g>
<path d="M62 565H1218" stroke="#aaa3c5" stroke-opacity=".14"/><text x="62" y="601" fill="#9d9bb1" font-size="13">Built by Udhay Bhat</text><text x="1218" y="601" text-anchor="end" fill="#b8a9e5" font-size="13">github.com/udhaybhat00</text>
</g></svg>
