<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-labelledby="title"><title id="title">From conversation to context to a useful response</title><defs><linearGradient id="a"><stop stop-color="#c4b1ff"/><stop offset="1" stop-color="#8ba4ff"/></linearGradient></defs><rect width="1200" height="210" rx="22" fill="#11131e"/><g font-family="Inter, -apple-system, Segoe UI, sans-serif"><g fill="#1e2130" stroke="#444356"><rect x="32" y="37" width="265" height="135" rx="17"/><rect x="324" y="37" width="265" height="135" rx="17"/><rect x="616" y="37" width="265" height="135" rx="17"/><rect x="908" y="37" width="260" height="135" rx="17"/></g><g fill="url(#a)" font-size="13" font-weight="700"><text x="54" y="65">01 / LISTEN</text><text x="346" y="65">02 / UNDERSTAND</text><text x="638" y="65">03 / RESPOND</text><text x="930" y="65">04 / REMEMBER</text></g><g fill="#efedf6" font-size="19" font-weight="600"><text x="54" y="102">Meeting audio</text><text x="346" y="102">Relevant context</text><text x="638" y="102">Your chosen AI</text><text x="930" y="102">Useful notes</text></g><g fill="#9da0b6" font-size="14"><text x="54" y="135">Local or configured STT</text><text x="346" y="135">Transcript + your profile</text><text x="638" y="135">Streaming answer overlay</text><text x="930" y="135">Review after the session</text></g></g></svg>
